services:
  - type: web
    name: yaobi-radar-api
    runtime: python
    repo: https://github.com/wang4866/yaobi-radar-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
